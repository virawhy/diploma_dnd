<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='img/DnD-ico.ico')}}">
    <title>&#1042;&#1093;&#1110;&#1076;</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-reset.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-reg-auth.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/header-footer-style.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-scrollbar.css')}}">
</head>
<body class="auth-page">
    <header class="index-header">
        <div class="index-header-logo">
            <a href="/"><img src="{{url_for('static', filename='img/logo.png')}}" alt="Dungeons and Dragons"></a>
        </div>
    </header>

    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="auth-title">
            <div class="auth-card">
                <div class="auth-card-heading">
                    <p class="auth-eyebrow">&#1055;&#1086;&#1074;&#1077;&#1088;&#1085;&#1077;&#1085;&#1085;&#1103; &#1076;&#1086; &#1082;&#1072;&#1084;&#1087;&#1072;&#1085;&#1110;&#1111;</p>
                    <h1 id="auth-title">&#1042;&#1093;&#1110;&#1076;</h1>
                </div>
                <form class="auth-form" action="" method="POST">
                    <label class="auth-field" for="email">
                        <span>E-mail</span>
                        <input type="email" name="email" id="email" placeholder="name@example.com" required>
                    </label>
                    <label class="auth-field" for="password">
                        <span>&#1055;&#1072;&#1088;&#1086;&#1083;&#1100;</span>
                        <input type="password" name="password" id="password" placeholder="********" required>
                    </label>
                    <button class="auth-submit" type="submit">&#1059;&#1074;&#1110;&#1081;&#1090;&#1080;</button>
                    <p class="auth-switch">
                        &#1053;&#1077;&#1084;&#1072;&#1108; &#1086;&#1073;&#1083;&#1110;&#1082;&#1086;&#1074;&#1086;&#1075;&#1086; &#1079;&#1072;&#1087;&#1080;&#1089;&#1091;?
                        <a href="registration.html">&#1047;&#1072;&#1088;&#1077;&#1108;&#1089;&#1090;&#1088;&#1091;&#1074;&#1072;&#1090;&#1080;&#1089;&#1103;</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    {% include 'footer.html' %}
</body>
</html>
