<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='img/DnD-ico.ico')}}">
    <title>&#1056;&#1077;&#1108;&#1089;&#1090;&#1088;&#1072;&#1094;&#1110;&#1103;</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-reset.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-reg-auth.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/header-footer-style.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style-scrollbar.css')}}">
</head>
<body class="auth-page">
    <header class="index-header">
        <div class="index-header-logo">
            <a href="/"><img src="{{url_for('static', filename='img/logo.png')}}" alt="Dungeons and Dragons"></a>
        </div>
    </header>

    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="registration-title">
            <div class="auth-card auth-card-wide">
                <div class="auth-card-heading">
                    <p class="auth-eyebrow">&#1053;&#1086;&#1074;&#1072; &#1087;&#1088;&#1080;&#1075;&#1086;&#1076;&#1072;</p>
                    <h1 id="registration-title">&#1056;&#1077;&#1108;&#1089;&#1090;&#1088;&#1072;&#1094;&#1110;&#1103;</h1>
                </div>
                <form class="auth-form" action="" method="POST">
                    <label class="auth-field" for="name">
                        <span>&#1053;&#1110;&#1082;&#1085;&#1077;&#1081;&#1084;</span>
                        <input type="text" name="username" id="name" placeholder="Hero name" required>
                    </label>
                    <label class="auth-field" for="email">
                        <span>E-mail</span>
                        <input type="email" name="email" id="email" placeholder="name@example.com" required>
                    </label>
                    <label class="auth-field" for="password">
                        <span>&#1055;&#1072;&#1088;&#1086;&#1083;&#1100;</span>
                        <input type="password" name="password" id="password" placeholder="********" required>
                    </label>
                    <label class="auth-field" for="confirm_password">
                        <span>&#1055;&#1110;&#1076;&#1090;&#1074;&#1077;&#1088;&#1076;&#1110;&#1090;&#1100; &#1087;&#1072;&#1088;&#1086;&#1083;&#1100;</span>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="********" required>
                    </label>
                    <button class="auth-submit" type="submit">&#1057;&#1090;&#1074;&#1086;&#1088;&#1080;&#1090;&#1080; &#1072;&#1082;&#1072;&#1091;&#1085;&#1090;</button>
                    <p class="auth-switch">
                        &#1042;&#1078;&#1077; &#1108; &#1072;&#1082;&#1072;&#1091;&#1085;&#1090;?
                        <a href="auth.html">&#1059;&#1074;&#1110;&#1081;&#1090;&#1080;</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    {% include 'footer.html' %}
</body>
</html>
